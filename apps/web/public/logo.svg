<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Engineering Shield -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" 
           stroke="url(#cyber-grad)" 
           stroke-width="3.5" 
           fill="#090d16" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Architectural Grid Lines -->
  <line x1="50" y1="6" x2="50" y2="94" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="10" y1="50" x2="90" y2="50" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Dynamic 'X' Tech Lattice Core -->
  <path d="M28,30 L72,70 M72,30 L28,70" 
        stroke="url(#cyber-grad)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Node Intersections (Learning Synapses) -->
  <circle cx="50" cy="50" r="6" fill="#090d16" stroke="#06b6d4" stroke-width="3" />
  <circle cx="50" cy="50" r="2.5" fill="#38bdf8" />
  <circle cx="28" cy="30" r="4.5" fill="#06b6d4" />
  <circle cx="72" cy="70" r="4.5" fill="#8b5cf6" />
  <circle cx="72" cy="30" r="4.5" fill="#3b82f6" />
  <circle cx="28" cy="70" r="4.5" fill="#06b6d4" />
</svg>
